plugins { id 'com.android.application' }

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def trustedBssids = localConfig.getProperty('trustedBssids', '').toLowerCase()
        .split(',').collect { it.trim() }.findAll { it }
if (!trustedBssids.every { it ==~ /([0-9a-f]{2}:){5}[0-9a-f]{2}/ }) {
    throw new GradleException('trustedBssids in local.properties must contain Wi-Fi BSSIDs')
}

android {
    namespace 'com.boiyelove.wirelessdebugkeeper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boiyelove.wirelessdebugkeeper'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'TRUSTED_BSSIDS', '"' + trustedBssids.join(',') + '"'
    }

    buildFeatures { buildConfig true }
}
